name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The classroom platforms, plus Linux to catch path assumptions early.
        os: [macos-14, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-tested.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          # Never touch the runner's keychain or credential store.
          WORKBENCH_SECURE_STORAGE: '0'
        run: python -m pytest -q

  frontend:
    name: Interface build and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check formatting
        working-directory: frontend
        run: npx prettier --check app components lib e2e

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build the static interface
        working-directory: frontend
        run: npm run build

      - name: Confirm the export is complete
        run: test -f frontend/out/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: interface
          path: frontend/out
          retention-days: 5
