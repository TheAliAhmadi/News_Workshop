name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign the application and installers (requires publisher accounts)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  # Sign when dispatching with sign=true, or when the repo variable is enabled for tag releases.
  SHOULD_SIGN: ${{ (github.event_name == 'workflow_dispatch' && inputs.sign) || vars.ENABLE_RELEASE_SIGNING == 'true' }}

jobs:
  preflight:
    name: Check signing configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate publisher configuration
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
        run: python packaging/signing_preflight.py

  interface:
    name: Build the interface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: interface
          path: frontend/out

  verify:
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-tested.txt -r requirements-dev.txt
      - env:
          WORKBENCH_SECURE_STORAGE: '0'
        run: python -m pytest -q

  macos:
    name: macOS package (Apple Silicon)
    needs: [preflight, interface, verify]
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: interface
          path: frontend/out

      - name: Install pinned dependencies
        run: pip install -r requirements-tested.txt -r requirements-build.txt

      - name: Generate icons
        run: python packaging/make_icons.py

      - name: Build the application and disk image
        timeout-minutes: 20
        run: bash packaging/build_macos.sh

      - name: Sign and notarize
        if: env.SHOULD_SIGN == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        timeout-minutes: 30
        run: |
          # Import the Developer ID certificate into a temporary keychain.
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          trap 'rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8"; security delete-keychain "$KEYCHAIN" || true' EXIT
          security create-keychain -p "" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" bash packaging/sign_macos.sh
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8"

      - name: Exercise the installed application
        timeout-minutes: 20
        run: python packaging/test_installer.py --output dist/smoke-macos.json

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-diagnostics
          path: |
            build/workbench/warn-workbench.txt
            dist/self-test-*.json
            dist/smoke-*.json
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: |
            dist/*.dmg
            dist/self-test-macos.json
            dist/smoke-*.json
            THIRD_PARTY_NOTICES.md

  windows:
    name: Windows package (x64)
    needs: [preflight, interface, verify]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: interface
          path: frontend/out

      - name: Install pinned dependencies
        run: |
          pip install -r requirements-tested.txt
          pip install -r requirements-build.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Generate icons
        run: python packaging/make_icons.py

      - name: Build the application folder
        timeout-minutes: 20
        run: pwsh -File packaging/build_windows.ps1 -SkipInstaller

      - name: Authenticate publisher through Azure OIDC
        if: env.SHOULD_SIGN == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the executable
        if: env.SHOULD_SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\dist\ResearchWorkbench\ResearchWorkbench.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build the installer
        run: pwsh -File packaging/build_windows.ps1 -InstallerOnly

      - name: Sign the installer
        if: env.SHOULD_SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: '*Setup.exe'
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify publisher signatures
        if: env.SHOULD_SIGN == 'true'
        shell: pwsh
        run: |
          $files = @(Get-Item dist/ResearchWorkbench/ResearchWorkbench.exe) + @(Get-ChildItem dist/*Setup.exe)
          if ($files.Count -ne 2) { throw 'Expected application and installer signatures.' }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid signature on $($file.Name): $($signature.Status)" }
          }

      - name: Exercise the installed application
        timeout-minutes: 20
        run: python packaging/test_installer.py --output dist/smoke-windows.json

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diagnostics
          path: |
            build/workbench/warn-workbench.txt
            dist/self-test-*.json
            dist/smoke-*.json
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/*Setup.exe
            dist/self-test-windows.json
            dist/smoke-*.json
            THIRD_PARTY_NOTICES.md

  draft:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Collect installers and notices
        run: |
          mkdir -p dist
          find assets -name '*.dmg' -o -name '*Setup.exe' | xargs -I{} cp {} dist/
          find assets -name 'self-test-*.json' -o -name 'smoke-*.json' | xargs -I{} cp {} dist/ || true
          # Prefer the notices regenerated during packaging over the checkout copy.
          NOTICE="$(find assets -name THIRD_PARTY_NOTICES.md | head -n 1)"
          if [ -n "$NOTICE" ]; then cp "$NOTICE" dist/THIRD_PARTY_NOTICES.md
          else cp THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          fi
          ls -la dist

      - name: Check sizes and write checksums
        run: python packaging/release_assets.py dist/*.dmg dist/*Setup.exe

      - name: Write the release notes
        run: python packaging/release_notes.py --output dist/RELEASE_NOTES.md

      - name: Create the draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ env.SHOULD_SIGN != 'true' }}
          name: Research Workbench ${{ github.ref_name }}${{ env.SHOULD_SIGN != 'true' && ' — unsigned preview' || '' }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.dmg
            dist/*Setup.exe
            dist/SHA256SUMS.txt
            dist/THIRD_PARTY_NOTICES.md
            dist/smoke-*.json
            dist/self-test-*.json
